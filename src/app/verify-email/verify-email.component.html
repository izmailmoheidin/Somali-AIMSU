<div class="container-fluid view-area">
    <div class="row">
        <div class="col-sm-9 col-md-7 col-lg-5 mx-auto">
          <div class="card card-signin my-5">
            <div class="card-body text-center">
              <h5 class="card-title">Email Verification</h5>

              <div *ngIf="isVerifying" class="text-center">
                <div class="spinner-border text-info" role="status">
                  <span class="sr-only">Verifying...</span>
                </div>
                <p class="mt-3">Verifying your email address...</p>
              </div>

              <div *ngIf="isSuccess" class="alert alert-success">
                <h5>Success!</h5>
                <p>{{message}}</p>
                <button class="btn btn-info mt-2" (click)="goToLogin()">Go to Login</button>
              </div>

              <div *ngIf="isAlreadyVerified" class="alert alert-info">
                <h5>Already Verified</h5>
                <p>{{message}}</p>
                <button class="btn btn-info mt-2" (click)="goToLogin()">Go to Login</button>
              </div>

              <div *ngIf="isError" class="alert alert-danger">
                <h5>Verification Failed</h5>
                <p>{{message}}</p>
                <button class="btn btn-info mt-2" (click)="goToLogin()">Go to Login</button>
              </div>

            </div>
          </div>
        </div>
    </div>
</div>
